# ViewAlyzer on the NUCLEO-C031C6 (STM32C031C6, Cortex-M0+).
#
# Two constraints shape this example:
#   - ARMv6-M: no DWT cycle counter, no ITM. Timestamps come from a user
#     timer (TIM3, src/main.c) and the transport is the RAM buffer drained
#     by the on-board ST-LINK.
#   - The C031 has NO 32-bit timer at all, so this is the reference user
#     of the 16-BIT timer source (CONFIG_VIEWALYZER_TIMER_BITS=16). The
#     tick is prescaled to 100 kHz so the counter wraps every 655 ms and
#     the main loop's VA_TickOverflowCheck() cadence covers the wrap
#     budget comfortably (see the timer comment in src/main.c).
#
# 12 KB RAM / 32 KB flash also make it the smallest recorder target so
# far, hence the trimmed ring, registries, and stacks below.

# ── ViewAlyzer recorder + user-trace hook (both required) ─────────────
CONFIG_VIEWALYZER=y
CONFIG_TRACING_USER=y

# ── Transport: RAM buffer over the on-board ST-LINK ───────────────────
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=y
CONFIG_VIEWALYZER_RAMBUF_SIZE=2048

# ── Timestamp source: custom free-running timer (TIM3, 16-bit) ────────
CONFIG_VIEWALYZER_TS_CUSTOM_TIMER=y
CONFIG_VIEWALYZER_TIMER_BITS=16

# ── Recorder sizes, trimmed for 12 KB of RAM ──────────────────────────
CONFIG_VIEWALYZER_MAX_TASKS=8
CONFIG_VIEWALYZER_MAX_SYNC_OBJECTS=8
CONFIG_VIEWALYZER_MAX_USER_EVENTS=4
CONFIG_VIEWALYZER_MAX_GPIOS=4
CONFIG_VIEWALYZER_MAX_HEAP_GAUGES=2

# ── Kernel features the recorder relies on ────────────────────────────
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ── Footprint ─────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=1280
CONFIG_IDLE_STACK_SIZE=320
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# ── Demo application ──────────────────────────────────────────────────
CONFIG_GPIO=y
