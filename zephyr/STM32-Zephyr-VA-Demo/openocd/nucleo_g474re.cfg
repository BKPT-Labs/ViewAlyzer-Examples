# OpenOCD config for the Nucleo-G474RE (onboard ST-LINK, SWD).
#
# Why this file exists instead of Zephyr's
# boards/st/nucleo_g474re/support/openocd.cfg: that file selects the
# 'hla_swd' transport, which the deprecated 'hla' adapter driver provides.
# OpenOCD's interface/stlink.cfg switched to the newer 'st-link' (DAP)
# driver, so on any recent OpenOCD the board file aborts with
#   Error: Debug adapter doesn't support 'hla_swd' transport
# and it never worked at all with an ST-LINK/V3.
#
# stlink-dap.cfg + dapdirect_swd is supported by OpenOCD 0.11 and newer
# (including the STM32CubeCLT and ST-patched builds) and covers ST-LINK
# V2, V2-1 and V3, so this config is portable across hosts and OSes.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set CHIPNAME stm32g474re
source [find target/stm32g4x.cfg]

reset_config srst_only srst_nogate connect_assert_srst
