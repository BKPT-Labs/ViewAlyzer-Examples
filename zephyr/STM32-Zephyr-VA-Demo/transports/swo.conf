# Transport override: ITM/SWO (build.py --swo).
# Merged after boards/<board>.conf, so it wins over the board default.
# Board confs keep owning SWO pin/frequency setup (CONFIG_LOG_BACKEND_SWO*).
CONFIG_VIEWALYZER_TRANSPORT_ITM=y
CONFIG_VIEWALYZER_TRANSPORT_RTT=n
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=n
