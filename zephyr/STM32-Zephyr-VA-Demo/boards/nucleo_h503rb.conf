CONFIG_VIEWALYZER_TRANSPORT_ITM=y
CONFIG_VIEWALYZER_TRANSPORT_RTT=n
CONFIG_LOG_BACKEND_SWO=y
# Must match the SWV start rate used by the host recorder.
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=2000000
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# STM32H503RB has only 32 KB SRAM — keep headroom to avoid crashes.
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# Right-size the recorder registries to what this demo actually creates
# (~14 sync objects, 4 user traces + a few ISR names, 1 user event) —
# the defaults cost ~3 KB more than the demo needs.
CONFIG_VIEWALYZER_MAX_SYNC_OBJECTS=24
CONFIG_VIEWALYZER_MAX_USER_TRACES=12
CONFIG_VIEWALYZER_MAX_USER_EVENTS=4
CONFIG_VIEWALYZER_MAX_GPIOS=4
CONFIG_VIEWALYZER_MAX_HEAP_GAUGES=4
CONFIG_VIEWALYZER_MAX_TASK_NAME_LEN=20
