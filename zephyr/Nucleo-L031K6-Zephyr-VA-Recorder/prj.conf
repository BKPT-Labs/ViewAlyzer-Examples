# ViewAlyzer on the NUCLEO-L031K6 (STM32L031K6, Cortex-M0+).
#
# The SMALLEST recorder target: 8 KB RAM / 32 KB flash. Same story as the
# C031 example (no DWT, no ITM, no 32-bit timer: 16-bit TIM2 tick at
# 100 kHz + RAM-buffer transport over the on-board ST-LINK), with every
# size knob trimmed to fit 8 KB. If you add threads or traces, budget RAM
# first - the link will fail loudly when it no longer fits.

# ── ViewAlyzer recorder + user-trace hook (both required) ─────────────
CONFIG_VIEWALYZER=y
CONFIG_TRACING_USER=y

# ── Transport: RAM buffer over the on-board ST-LINK ───────────────────
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=y
CONFIG_VIEWALYZER_RAMBUF_SIZE=1024

# ── Timestamp source: custom free-running timer (TIM2, 16-bit) ────────
CONFIG_VIEWALYZER_TS_CUSTOM_TIMER=y
CONFIG_VIEWALYZER_TIMER_BITS=16

# ── Recorder sizes, trimmed for 8 KB of RAM ───────────────────────────
CONFIG_VIEWALYZER_MAX_TASKS=6
CONFIG_VIEWALYZER_MAX_SYNC_OBJECTS=4
CONFIG_VIEWALYZER_MAX_USER_EVENTS=2
CONFIG_VIEWALYZER_MAX_GPIOS=2
CONFIG_VIEWALYZER_MAX_HEAP_GAUGES=1

# ── Kernel features the recorder relies on ────────────────────────────
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ── Footprint ─────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=320
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=448
CONFIG_ISR_STACK_SIZE=768

# ── Demo application ──────────────────────────────────────────────────
CONFIG_GPIO=y
