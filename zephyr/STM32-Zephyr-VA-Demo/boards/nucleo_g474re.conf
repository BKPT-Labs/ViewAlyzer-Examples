CONFIG_VIEWALYZER_TRANSPORT_ITM=y
CONFIG_VIEWALYZER_TRANSPORT_RTT=n
CONFIG_LOG_BACKEND_SWO=y
# Must match the SWV start rate used by the host recorder.
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=2000000
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
# Scheduler/resource tracing produces roughly 130 KB/s in this demo.
# Give RAM-buffer captures more headroom while the host services metadata.
CONFIG_VIEWALYZER_RAMBUF_SIZE=16384
