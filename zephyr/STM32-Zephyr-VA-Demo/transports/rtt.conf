# Transport override: SEGGER RTT (build.py --rtt).
# Merged after boards/<board>.conf, so it wins over the board default.
# Requires the Zephyr Segger module in the west workspace (see the recorder
# Kconfig help). Channel/buffer sizing comes from the Kconfig defaults unless
# the board conf sets them.
CONFIG_VIEWALYZER_TRANSPORT_ITM=n
CONFIG_VIEWALYZER_TRANSPORT_RTT=y
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=n
