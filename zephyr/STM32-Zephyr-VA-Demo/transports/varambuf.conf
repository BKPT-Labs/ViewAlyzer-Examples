# Transport override: ViewAlyzer RAM buffer (build.py --varambuf).
# Merged after boards/<board>.conf, so it wins over the board default.
# The recorder owns a ring buffer in target RAM; the host drains it through
# the debug probe with memory reads (works with ST-LINK, no SEGGER code).
CONFIG_VIEWALYZER_TRANSPORT_ITM=n
CONFIG_VIEWALYZER_TRANSPORT_RTT=n
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=y
# CONFIG_VIEWALYZER_RAMBUF_SIZE=8192
# CONFIG_VIEWALYZER_RAMBUF_BLOCK=n
