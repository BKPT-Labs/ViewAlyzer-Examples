[package]
name = "nucleo-g474-embassy"
version = "0.1.0"
edition = "2024"
publish = false

# Use this firmware's lockfile even when CI checks out the examples inside another Cargo workspace.
[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", features = ["stm32g474re", "memory-x", "dual-bank", "time-driver-any"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
panic-halt = "1"
viewalyzer-embassy = { path = "../../../ViewAlyzer/ViewAlyzerRecorder/embassy" }

[build-dependencies]
cc = "1"

[profile.release]
debug = 2
