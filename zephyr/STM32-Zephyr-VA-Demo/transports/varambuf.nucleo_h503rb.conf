# Board tuning for the RAM-buffer transport on the Nucleo-H503RB.
# Merged after transports/varambuf.conf (see build.py apply_transport).
# The H503RB has only 32 KB SRAM, so the default 8 KB trace ring does not
# fit next to this demo's ~20 threads — a 4 KB ring still streams the full
# demo cleanly at the default host poll rate.
CONFIG_VIEWALYZER_RAMBUF_SIZE=4096
# Nothing in the demo k_mallocs from the system heap (the heap demo has its
# own pool), so 1 KB is plenty here.
CONFIG_HEAP_MEM_POOL_SIZE=1024
