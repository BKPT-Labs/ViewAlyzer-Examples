# ViewAlyzer on the NUCLEO-G0B1RE (STM32G0B1RE, Cortex-M0+).
#
# This core is ARMv6-M: no DWT cycle counter and no ITM. Both recorder
# defaults therefore change on this board (the Kconfig choices below would
# pick these values by themselves; they are set explicitly so the example
# documents itself):
#   - timestamps come from a user timer (TIM2, set up in src/main.c and
#     handed to VA_Init), not DWT_CYCCNT;
#   - the transport is the ViewAlyzer RAM buffer, drained by the on-board
#     ST-LINK with non-intrusive memory reads (no SWO pin, no SEGGER code).

# ── ViewAlyzer recorder + user-trace hook (both required) ─────────────
CONFIG_VIEWALYZER=y
CONFIG_TRACING_USER=y

# ── Transport: RAM buffer over the on-board ST-LINK ───────────────────
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=y
CONFIG_VIEWALYZER_RAMBUF_SIZE=8192

# ── Timestamp source: custom free-running timer (TIM2, 32-bit) ────────
# VA_Init() takes the tick function and its rate - see src/main.c.
CONFIG_VIEWALYZER_TS_CUSTOM_TIMER=y
CONFIG_VIEWALYZER_TIMER_BITS=32

# ── Kernel features the recorder relies on ────────────────────────────
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ── Demo application ──────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_NEWLIB_LIBC=y
