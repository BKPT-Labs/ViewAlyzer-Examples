# Transport override: post-mortem snapshot (build.py --snapshot).
# Merged after boards/<board>.conf, so it wins over the board default.
# The RAM buffer becomes a wrapping snapshot ring that always holds the most
# recent trace window: run untethered, then read it out after the fact with
#   ViewAlyzer --headless --snapshot --transport stlink-rambuf ...
# No live streaming in this mode (use --varambuf for that, or add
# CONFIG_VIEWALYZER_SNAPSHOT=y to a streaming build for both at once).
CONFIG_VIEWALYZER_TRANSPORT_ITM=n
CONFIG_VIEWALYZER_TRANSPORT_RTT=n
CONFIG_VIEWALYZER_TRANSPORT_RAMBUF=y
CONFIG_VIEWALYZER_RAMBUF_WRAP=y
# CONFIG_VIEWALYZER_RAMBUF_SIZE=8192
