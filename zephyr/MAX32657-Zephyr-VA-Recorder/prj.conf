# ViewAlyzer on the ADI MAX32657EVKIT (Cortex-M33), streaming over the
# on-board J-Link OB via SEGGER RTT. RTT needs no SWO pin and works through
# the standard SWD debug connection, so it is the natural transport here.

# ── ViewAlyzer recorder + user-trace hook (both required) ─────────────
CONFIG_VIEWALYZER=y
CONFIG_TRACING_USER=y

# ── Transport: SEGGER RTT ─────────────────────────────────────────────
# Channel 0: J-Link's GDB-server RTT socket (port 19021, the app's jlink-rtt
# transport) streams channel 0, so the recorder publishes there.
#
# Keep the DEFAULT RTT up-buffer size: enlarging it pushes the _SEGGER_RTT
# control block deeper into RAM. The vacfg pins the block via "rtt-address"
# (from the ELF's _SEGGER_RTT symbol) — update it after builds that move .bss.
CONFIG_VIEWALYZER_TRANSPORT_RTT=y
CONFIG_VIEWALYZER_TRANSPORT_ITM=n
CONFIG_VIEWALYZER_RTT_CHANNEL=0
CONFIG_VIEWALYZER_CONFIGURE_RTT=y
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=n

# ── Kernel features the recorder relies on ────────────────────────────
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ── Demo application ──────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_NEWLIB_LIBC=y
